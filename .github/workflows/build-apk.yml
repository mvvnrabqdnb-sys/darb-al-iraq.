name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip -d work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Server tests
        run: cd work/darb-al-iraq/server && python3 -I -m unittest discover -s tests -v
      - name: Kotlin core checks
        run: |
          GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
          bash work/darb-al-iraq/tools/run_core_checks.sh "$GRADLE_HOME"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: work/darb-al-iraq/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Check APK exists
        run: ls -l work/darb-al-iraq/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: darb-al-iraq-debug-apk
          path: work/darb-al-iraq/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
